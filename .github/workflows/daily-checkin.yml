name: Buddy加油站每日签到

# 每天北京时间 8:30 自动签到（UTC 0:30）
# GitHub Actions 的调度可能延迟几分钟，属正常现象
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允许在网页上手动点击测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行签到 + 派猫猫旅行
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
        run: python daily_checkin.py
